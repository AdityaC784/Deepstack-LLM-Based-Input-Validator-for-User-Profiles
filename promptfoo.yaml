assertionTemplates:
  jsonStructureCheck:
    type: assert-set
    assert:
      - type: is-json
      - type: python
        value: |
          import json

          try:
              o = json.loads(output)
          except Exception:
              return False

          is_bool = isinstance(o.get("is_valid"), bool)

          def arr_str(a):
              return isinstance(a, list) and all(isinstance(x, str) for x in a)

          return is_bool and arr_str(o.get("errors")) and arr_str(o.get("warnings"))


prompts:
  - |
    You are a strict data validator expert. Validate the following user profile data and return ONLY a valid JSON response.
    
    User Profile Data:
    {{userInput}}
    
    ERRORS (Critical issues):
    1. 'name' field is mandatory and non-empty and real . If missing or empty or invalid(User,Temp,) this is an error.
    2. 'email' (if present) must be valid email format
    3. 'age' (if present) must be positive number
    4. 'country' (if present) must be ISO-2 country code (2 uppercase letters like US, IN, GB)
    5. 'phone' is mandatory and must be E.164 format (starts with + and digits)
    
    WARNINGS (Non-critical):
    1. Age below 18
    2. Name shorter than 3 characters or fake ex.(User,Temp) 
    3. Disposable email domains (akixpres.com, tempmail.com, etc.)
    4. Country code mismatch in phone vs country field

    Return ONLY a single JSON object that matches the schema.
    Return ONLY this JSON structure, with no additional text BEFORE or AFTER:
    
    {
      "is_valid": boolean,
      "errors": [error messages],
      "warnings": [warning messages]
    }
    
    Do NOT wrap the JSON in ```json ``` or any other formatting.


  - |
    You are a strict data validator. Validate the following user profile data and return ONLY a valid JSON response with no additional text.

    User Profile Data:
    {{userInput}}

    Validation Instructions:
    You must validate this data against the following constraints:

    ERRORS (Critical issues - field is invalid):
    1. The 'name' field is mandatory. If missing or empty or wrong/fake, this is an error.
    2. If 'email' is provided, it must be a valid email address format (must contain @ and a domain).
    3. If 'age' is provided, it must be a positive number (greater than 0). Negative numbers or zero are errors.
    4. If 'country' is provided, it must be a valid ISO-2 country code format (exactly 2 uppercase letters, like US, IN, GB, etc.). Common country codes include: US, IN, GB, CA, AU, DE, FR, JP, BR, MX, etc.
    5. The 'phone' field is mandatory. If present, it must follow the E.164 international format (starts with + and contains only digits, typically +[country code][number], like +919876543210 for India).

    WARNINGS (Non-critical issues - field is present but suboptimal):
    1. If 'age' is provided and less than 18, issue a warning.
    2. If 'name' is provided but contains fewer than 3 characters or fake , issue a warning.
    3. If 'email' is provided and uses a known disposable/temporary email domain (like akixpres.com, tempmail.com, guerrillamail.com, etc.), issue a warning.
    4. If both 'phone' and 'country' are provided, check if the country code in the phone number (the digits immediately after the + sign) aligns with the country code. For example, phone +919876543210 starts with +91 (India), so country should be IN. If they don't match, issue a warning.

    Important Rules:
    - Only report fields that are present in the input. Ignore missing/null fields.
    - Be strict with errors - if a field violates an error rule, report it.
    - Be thoughtful with warnings - report actual issues, not false positives.
    - All validation messages must reference the actual values from the input.
    - If multiple rules apply to a field, report all of them.
     
    Return ONLY this JSON structure, with no additional text before or after:
    {
      "is_valid": boolean (true only if errors list is empty),
      "errors": [list of error messages],
      "warnings": [list of warning messages]
    }

    Example response format:
    {
      "is_valid": false,
      "errors": ["name is required", "email is not a valid email address"],
      "warnings": ["age is below recommended minimum"]
    }
    
    Do NOT wrap the JSON in ```json ``` or any other formatting.

    Now validate the provided user profile data.




providers:
  - id: groq:llama-3.3-70b-versatile
  # - id: google:gemini-2.5-pro
  # - id: perplexity:sonar-pro
 

tests:
  
  - description: "Valid user profile"
    vars:
      userInput: |
        {
          "name": "Aarav Patel",
          "email": "aarav.patel@gmail.com",
          "age": 24,
          "country": "IN",
          "phone": "+919876543210"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"
    

  - description: "Invalid user profile with multiple errors"
    vars:
      userInput: |
        {
          "name": "",
          "email": "user@gmail",
          "age": 16,
          "country": "India",
          "phone": "99999"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"

 
  - description: "Missing required name field"
    vars:
      userInput: |
        {
          "email": "test@gmail.com",
          "age": 25,
          "country": "US",
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"

 
  - description: "Missing required phone field"
    vars:
      userInput: |
        {
          "name": "John Doe",
          "email": "john@gmail.com",
          "age": 30,
          "country": "US"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Invalid email format"
    vars:
      userInput: |
        {
          "name": "John Doe",
          "email": "invalid.email",
          "age": 30,
          "country": "US",
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"

  
  - description: "Phone not in E.164 format"
    vars:
      userInput: |
        {
          "name": "Jane Smith",
          "email": "jane@gmail.com",
          "age": 28,
          "country": "US",
          "phone": "2025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Country not ISO-2 format"
    vars:
      userInput: |
        {
          "name": "Ram Kumar",
          "email": "ram@gmail.com",
          "age": 22,
          "country": "India",
          "phone": "+919876543210"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Negative age value"
    vars:
      userInput: |
        {
          "name": "Test User",
          "email": "test@gmail.com",
          "age": -5,
          "country": "US",
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Minor age triggers warning"
    vars:
      userInput: |
        {
          "name": "Young User",
          "email": "young@gmail.com",
          "age": 16,
          "country": "US",
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Name shorter than 3 characters triggers warning"
    vars:
      userInput: |
        {
          "name": "Jo",
          "email": "jo@gmail.com",
          "age": 25,
          "country": "US",
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Disposable email triggers warning"
    vars:
      userInput: |
        {
          "name": "Temp User",
          "email": "user@tempmail.com",
          "age": 25,
          "country": "US",
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"

  - description: "Country code mismatch in phone"
    vars:
      userInput: |
        {
          "name": "John Smith",
          "email": "john@gmail.com",
          "age": 30,
          "country": "IN",
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Null fields should be ignored"
    vars:
      userInput: |
        {
          "name": "Valid User",
          "email": null,
          "age": null,
          "country": null,
          "phone": "+12025551234"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "Minimal valid input"
    vars:
      userInput: |
        {
          "name": "Alice",
          "phone": "+11234567890"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "valid user"
    vars:
      userInput: |
        {
          "name": "Aditya Ch",
          "phone": "+919876543210",
          "email": "aditya@gmail.com",
          "country": "IN",
          "age": 20
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"


  - description: "valid user"
    vars:
      userInput: |
        {
          "name": "Alice Patil",
          "age": 30
          "country": "US",

          "phone": "+11234567890"
        }
    assert:
      - $ref: "#/assertionTemplates/jsonStructureCheck"

evaluateOptions:
  maxConcurrency: 5
  showProgressBar: true
